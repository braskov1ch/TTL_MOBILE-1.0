<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080610">
<title>Последний Фонарь — спуск в Бездну</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" aria-label="Игровое поле The Last Lantern"></canvas>
<!-- Отдельная мобильная композиция. ПК-Canvas остаётся источником графики игрового мира. -->
<div id="mobile-controls" class="mobile-controls" hidden>
  <section id="mobile-play-ui" class="mobile-play-ui" aria-label="Мобильная игра">
    <header id="mobile-status" class="mobile-status" aria-label="Показатели героя"></header>
    <div class="mobile-layout">
      <aside class="mobile-rail mobile-rail-left" aria-label="Передвижение">
        <div class="mobile-stick" id="mobile-stick" role="group" aria-label="Джойстик движения">
          <span class="stick-cross">✣</span><span class="stick-knob" id="mobile-stick-knob"></span>
        </div>
        <span class="rail-caption">ДВИЖЕНИЕ</span>
      </aside>
      <div class="mobile-arena"><canvas id="mobile-view" aria-label="Игровой мир"></canvas></div>
      <aside class="mobile-rail mobile-rail-right" aria-label="Действия">
        <div class="mobile-action-grid">
          <button id="mobile-attack" class="touch-button touch-attack" type="button" aria-label="Атака и прицеливание"><span class="attack-knob" id="mobile-attack-knob">⚔</span><small>АТАКА</small></button>
          <button id="mobile-skill" class="touch-button touch-skill" type="button" aria-label="Умение героя">✦<small>УМЕНИЕ</small></button>
          <button id="mobile-dash" class="touch-button touch-dash" type="button" aria-label="Рывок">➤<small>РЫВОК</small></button>
          <button id="mobile-potion" class="touch-button touch-potion" type="button" aria-label="Выпить зелье">✚<small>ЗЕЛЬЕ</small></button>
          <button id="mobile-flask" class="touch-button touch-flask" type="button" aria-label="Бросить склянку">⌁<small>СКЛЯНКА</small></button>
          <button id="mobile-active" class="touch-button touch-active" type="button" aria-label="Применить артефакт">✧<small>АРТЕФАКТ</small></button>
          <button id="mobile-pause" class="touch-button touch-pause" type="button" aria-label="Пауза">Ⅱ<small>ПАУЗА</small></button>
        </div>
      </aside>
    </div>
  </section>
  <section id="mobile-menu-ui" class="mobile-menu-ui" aria-label="Мобильное меню">
    <div class="mobile-menu-shell">
      <div class="mobile-menu-heading"><div><div class="mobile-brand">THE LAST LANTERN</div><h1 id="mobile-menu-title">ПОСЛЕДНИЙ ФОНАРЬ</h1></div><button id="mobile-back" type="button" aria-label="Вернуться назад">← НАЗАД</button></div>
      <div id="mobile-menu-content" class="mobile-menu-content"></div>
    </div>
  </section>
</div>
<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/lore.js"></script>
<script src="js/relics.js"></script>
<script src="js/hero.js"></script>
<script src="js/hero_ext.js"></script>
<script src="js/enemies.js"></script>
<script src="js/enemies2.js"></script>
<script src="js/bosses.js"></script>
<script src="js/bosses2.js"></script>
<script src="js/hazards.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/events.js"></script>
<script src="js/meta.js"></script>
<script src="js/modes.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/render_ent.js"></script>
<script src="js/render_ent2.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui2.js"></script>
<script src="js/i18n_en.js"></script>
<script src="js/mobile.js"></script>
<script src="js/main.js"></script>
</body>
</html>
