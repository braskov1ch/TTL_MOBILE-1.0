<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080610">
<title>Последний Фонарь — спуск в Бездну</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" aria-label="Игровое поле The Last Lantern"></canvas>
<!-- Сенсорные элементы изолированы от Canvas, поэтому поддерживают несколько пальцев одновременно. -->
<div id="mobile-controls" class="mobile-controls" aria-label="Сенсорное управление" hidden>
  <div id="mobile-orientation" class="mobile-orientation" role="status">↻ Поверните устройство горизонтально — так удобнее играть</div>
  <div id="mobile-play-ui" class="mobile-play-ui">
    <div id="mobile-status" class="mobile-status" aria-live="off"></div>
    <div class="mobile-stick" id="mobile-stick" role="group" aria-label="Джойстик движения">
      <span class="stick-cross">✣</span><span class="stick-knob" id="mobile-stick-knob"></span>
      <span class="touch-label">ДВИЖЕНИЕ</span>
    </div>
    <button id="mobile-attack" class="touch-button touch-attack" type="button" aria-label="Атака и прицеливание">
      <span class="attack-knob" id="mobile-attack-knob">⚔</span><span class="touch-label">АТАКА</span>
    </button>
    <button id="mobile-skill" class="touch-button touch-skill" type="button" aria-label="Умение героя">✦<span class="touch-label">УМЕНИЕ</span></button>
    <button id="mobile-dash" class="touch-button touch-dash" type="button" aria-label="Рывок">➤<span class="touch-label">РЫВОК</span></button>
    <button id="mobile-potion" class="touch-button touch-potion" type="button" aria-label="Выпить зелье">✚<span class="touch-label">ЗЕЛЬЕ</span></button>
    <button id="mobile-flask" class="touch-button touch-flask" type="button" aria-label="Бросить склянку">⌁<span class="touch-label">СКЛЯНКА</span></button>
    <button id="mobile-active" class="touch-button touch-active" type="button" aria-label="Применить артефакт">✧<span class="touch-label">АРТЕФАКТ</span></button>
    <button id="mobile-pause" class="touch-button touch-pause" type="button" aria-label="Пауза">Ⅱ</button>
  </div>
  <div id="mobile-menu-ui" class="mobile-menu-ui" aria-label="Навигация по меню">
    <button type="button" data-mobile-key="ArrowLeft" aria-label="Влево">◀</button>
    <button type="button" data-mobile-key="ArrowUp" aria-label="Вверх">▲</button>
    <button type="button" data-mobile-key="ArrowDown" aria-label="Вниз">▼</button>
    <button type="button" data-mobile-key="ArrowRight" aria-label="Вправо">▶</button>
    <button type="button" data-mobile-key="Enter" class="mobile-confirm">OK</button>
    <button type="button" id="mobile-start" data-mobile-key="Space" hidden>▶</button>
    <button type="button" data-mobile-key="Escape" aria-label="Назад">↩</button>
  </div>
  <div id="mobile-seed-ui" class="mobile-seed-ui">
    <label for="mobile-seed-field">Код сида</label><input id="mobile-seed-field" type="text" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="Введите сид">
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/lore.js"></script>
<script src="js/relics.js"></script>
<script src="js/hero.js"></script>
<script src="js/hero_ext.js"></script>
<script src="js/enemies.js"></script>
<script src="js/enemies2.js"></script>
<script src="js/bosses.js"></script>
<script src="js/bosses2.js"></script>
<script src="js/hazards.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/events.js"></script>
<script src="js/meta.js"></script>
<script src="js/modes.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/render_ent.js"></script>
<script src="js/render_ent2.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui2.js"></script>
<script src="js/i18n_en.js"></script>
<script src="js/mobile.js"></script>
<script src="js/main.js"></script>
</body>
</html>
